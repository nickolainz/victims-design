<!doctype html>
<!--
  Starter shell for a Victims Information content page.
  Made when packaging the skill (not a file from the live site): it wires up the
  stylesheets, the page skeleton and the quick exit. Fill the marked slots by
  copying markup from ../components/<Name>.html (the <body> contents), keeping
  every class name. Paths assume this file stays in assets/templates/.
-->
<html lang="en-nz" data-theme="blue">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page title | Victims Information</title>
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../css/bundle.css">
<style>
  /* Skip link: hidden until focused. The site's own skip link styling is not in bundle.css. */
  .skip-link { position: absolute; left: 1rem; top: -100px; z-index: 1000; padding: .75rem 1rem;
    background: var(--white); color: var(--navy); font-family: var(--font-sans); font-weight: 700;
    border-radius: var(--radius-sm); outline: 2px solid var(--green); }
  .skip-link:focus { top: 1rem; }
</style>
</head>
<body class="page page--blockcontentpage">
<a class="skip-link" href="#main-content">Skip to main content</a>

<!-- SLOT: Header — copy from ../components/Header.html. Keeps the topbar with 111 and 0800 650 654. -->

<main id="main-content" class="main base-container block-content-page mjb">

  <!-- SLOT: Banner (content variant) — ../components/Banner.html. One per page, first in main. Holds the h1. -->

  <!-- SLOT: Breadcrumbs — ../components/Breadcrumbs.html -->

  <div class="inner inner--with-sidebar">
    <!-- Sidebar (columns 1–4): TableOfContents — ../components/TableOfContents.html (mark .no-print) -->
    <!-- Content (columns 5–12): Overview lead, then blocks (RichText, Alert, Accordion, GuidedProcess …) -->
    <!-- End with FeaturedLinks (previous and next) — ../components/FeaturedLinks.html -->
  </div>

  <!-- SLOT: PageActions (print, share, back to top) — ../components/PageActions.html (mark .no-print) -->
</main>

<!-- SLOT: Footer — copy from ../components/Footer.html (carries the NZ Government logo). -->

</body>
</html>
