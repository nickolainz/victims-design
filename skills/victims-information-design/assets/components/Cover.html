<!-- @dsCard height=340 -->
<!doctype html>
<html data-theme="blue" lang="en-NZ">
<head>
<!-- Added by the skill packager so this file renders standalone: -->
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../css/bundle.css">

<meta charset="utf-8">
<title>Victims Information Design System</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--white); color: var(--navy); overflow: hidden; }
  .cover { position: relative; width: 960px; height: 340px; overflow: hidden; }
  .band { position: absolute; left: 0; top: 0; width: 960px; height: 112px; }
  .band svg { display: block; width: 960px; height: 112px; overflow: hidden; }
  .navy { fill: var(--navy); }
  .tint { fill: var(--mist-2); }
  .sun { fill: var(--sun); }
  .teal { fill: var(--teal-dark); }
  .ground { fill: var(--white); }
  .blk { rx: var(--radius-xl); }
  .pill { rx: 12px; }
  .words { position: absolute; left: 40px; right: 40px; top: 144px; }
  .name { margin: 0; font-family: var(--font-serif); font-weight: 900; font-size: 64px; line-height: .95; letter-spacing: -.016em; color: var(--navy); }
  .tag { margin: 12px 0 0 2px; font-family: var(--font-sans); font-size: 14px; line-height: 20px; color: var(--slate-soft); max-width: 440px; }
</style>
</head>
<body>
<div class="cover">
  <div class="band" aria-hidden="true">
    <svg viewBox="0 0 960 112" width="960" height="112">
      <!--
        blocks      navy 352×128 bled off the top (the brand ink, largest) · mist-2 240×112 (the enlarged-mark tint) · sun 112×112 (quick exit) · teal-dark 224×128 bled off the top and right edge, about 40% of the 960×340 cover
        arrangement a strip of unequal bands across the top (top-band skeleton: the two-line name needs the full width), space-16 gutters, the outer blocks bleeding like the hero’s cropped mark
        pattern     the logo mark’s own vocabulary, discs and diagonal pills: the publication dot trio (three discs fading 1/.72/.45) cut from navy and from sun in the ground, and pills on the mark’s 48° diagonal crossing the tint and the teal
        scales      gutters space-16; trio pitch space-32, discs r12; pill width 24 (rx 12, half the short side), pitch 56 = space-32 + space-24; block corners radius-xl
      -->
      <defs>
        <clipPath id="c-tint"><rect x="368" y="0" width="240" height="112" rx="16"/></clipPath>
        <clipPath id="c-teal"><rect x="752" y="-16" width="224" height="128" rx="16"/></clipPath>
      </defs>
      <rect class="navy blk" x="0" y="-16" width="352" height="128" rx="16"/>
      <rect class="tint blk" x="368" y="0" width="240" height="112" rx="16"/>
      <rect class="sun blk" x="624" y="0" width="112" height="112" rx="16"/>
      <rect class="teal blk" x="752" y="-16" width="224" height="128" rx="16"/>

      <circle class="ground" cx="48" cy="72" r="12"/>
      <circle class="ground" cx="80" cy="72" r="12" opacity=".72"/>
      <circle class="ground" cx="112" cy="72" r="12" opacity=".45"/>

      <g clip-path="url(#c-tint)">
        <rect class="navy pill" x="360" y="44" width="160" height="24" rx="12" transform="rotate(-48 440 56)"/>
        <rect class="navy pill" x="416" y="44" width="160" height="24" rx="12" transform="rotate(-48 496 56)"/>
        <rect class="teal pill" x="472" y="44" width="160" height="24" rx="12" transform="rotate(-48 552 56)"/>
        <rect class="navy pill" x="528" y="44" width="160" height="24" rx="12" transform="rotate(-48 608 56)"/>
      </g>

      <circle class="ground" cx="648" cy="88" r="12"/>
      <circle class="ground" cx="680" cy="88" r="12" opacity=".72"/>
      <circle class="ground" cx="712" cy="88" r="12" opacity=".45"/>

      <g clip-path="url(#c-teal)">
        <rect class="tint pill" x="784" y="44" width="160" height="24" rx="12" transform="rotate(-48 864 56)"/>
        <rect class="tint pill" x="840" y="44" width="160" height="24" rx="12" transform="rotate(-48 920 56)"/>
        <rect class="tint pill" x="896" y="44" width="160" height="24" rx="12" transform="rotate(-48 976 56)"/>
      </g>
    </svg>
  </div>
  <div class="words">
    <h1 class="name">Victims Information<br>Design System</h1>
    <p class="tag">The look, voice and parts of victimsinfo.govt.nz, for every product.</p>
  </div>
</div>
</body>
</html>
